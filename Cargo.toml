[package]
name = "rust-http"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
encoding_rs = "0.8.33"
hyper = { version = "0.14", features = ["full"] }
log = "0.4.20"
reqwest = "0.11.22"
serde_json = "1.0.107"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1.3"
