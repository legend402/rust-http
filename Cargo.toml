# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
resolver = "3"
members = [".", "lib", "entity", "migration"]

[workspace.dependencies]
actix-web = "4.4.0"
dotenvy = "0.15.7"
sea-orm = "1.1.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
log = "0.4.0"
env_logger = "0.10.0"
chrono = "0.4.41"
